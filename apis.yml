aid: apacfin
name: APAC Financial Services
description: 'APAC Financial Services (Apacfin) is a Mumbai-based, Reserve Bank of India registered
  Non-Banking Financial Company (NBFC) that provides customized MSME business loans to underbanked and
  underserved micro, small, and medium enterprises across India. APAC offers tech-enabled, largely
  paperless digital onboarding, quick disbursal with minimal documentation, and a mobile app (APACM) for
  loan tracking, EMI payments, and service requests. The lender reports roughly Rs 2,479 Crore of assets
  under management across 226 branches in six states, serving more than 52,000 customers, and carries an
  ICRA A (Stable) credit rating. APAC is a portfolio company of Norwest Venture Partners. No public
  developer API, OpenAPI specification, or developer portal is published; customer and partner interaction
  is via the mobile app and hosted customer/complaint portals.'
